name: Lean CI

on:
  push:
    paths:
      - 'lean4_formalization/**'
      - '.github/workflows/lean_ci.yml'
  pull_request:
    paths:
      - 'lean4_formalization/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean4_formalization

    steps:
      - uses: actions/checkout@v4

      # Builds the default target, which is the AgoraPhysics library, i.e.
      # proof checking. It deliberately does not build the executable, which
      # would native-compile all of mathlib.
      - uses: leanprover/lean-action@v1

      # Scope this to the project's own sources. A repository-wide grep would
      # match the thousands of legitimate `sorry` occurrences inside
      # .lake/packages/mathlib and fail on every run.
      - name: No 'sorry' in project sources
        run: |
          if grep -rn '\bsorry\b' AgoraPhysics AgoraPhysics.lean Main.lean; then
            echo "FAILED: 'sorry' present in project sources"
            exit 1
          fi
          echo "OK: no 'sorry' in project sources"

      # The authoritative check: #print axioms lines in Protocols.lean must not
      # report sorryAx. This catches a sorry reached through an import, which
      # grep cannot see.
      - name: No sorryAx in axiom audit
        run: |
          lake build 2>&1 | tee build.log
          if grep -q 'sorryAx' build.log; then
            echo "FAILED: a theorem depends on sorryAx"
            exit 1
          fi
          echo "OK: axiom audit clean"
